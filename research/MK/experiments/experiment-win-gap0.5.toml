# Runs for the Markov paper on the Windows servers. A separate site: its results are never mixed with MUSICA's
# (experiment.toml), so solver settings and threads are sized for these machines. MIP gap 0.5 % (experiment.toml: 0.3 %):
# RTS-GMLC's full-year Truths do not reach 0.3 % (the bound stalls at ~0.38 % until Gurobi runs out of memory). Only one hardware type per run (solver
# times / work units of different CPUs are not comparable). One worker per server, started by hand (see README,
# "Windows servers"):
#   python research/MK/cluster.py worker experiment-win-gap0.5 --detach --node-dir <large local disk>
#   python research/MK/cluster.py status experiment-win-gap0.5          # / stop / restart, from any server

name = "experiment-win-gap0.5"   # pool and logs go to research/MK/runs/<name>/ in the repo clone on the network drive

[markov]
args = ["--network", "TP", "--mip-gap", "0.005"]   # model options: as in experiment.toml, except the MIP gap
# NodefileStart (GB): as on MUSICA - the B&B tree goes to node files early (--node-dir on a fast local SSD); the same for
# all solves of a dataset (it affects the runtime).
node_file_start = { default = 8, "TX-123BT" = 16 }

[grid]
datasets = ["data/RTS-GMLC", "data/TX-123BT", "data/NREL-118"]   # = scheduling preference (as in experiment.toml)
stretch_demand = [1.0, 0.5, 0.7, 0.9]
clusters = [3, 5, 7, 14, 21, 28]
# 'perturb:1.0' = random transition matrix (optional runs): only without demand stretching, queued after all other runs
tm = ["base", "shift:1", "shift:2", { spec = "perturb:1.0", stretch_demand = [1.0], low_priority = true }]
edges = ["NoEnf", "Cyclic", "Markov"]                # Truth is added automatically where it applies
tasks = ["main", "operational", "regret", "invest-regret", "operational-regret",
         "original-invest-regret", "original-regret"]   # original-* only for tm = base
truth_original = true                                    # one Original Truth per dataset and demand variability

# Resources per task: prior estimates of the task pool (memory / runtime improve with every measured attempt).
# cpus: the same for all solves of a dataset (comparable work units); a worker never starts a task with more cpus than
# its cores. Memory is the bottleneck for the full-year solves. A worker never starts a task whose estimate exceeds its
# RAM, so mem must stay below the RAM for every task that should run here (estimates above the packing share run
# alone). TX-123BT's full-year solves and Original Truths are capped just below the RAM so they are tried (alone): if
# they run out of memory, stop scheduling TX-123BT.
[resources.prepare]
default = { cpus = 4, mem = "32G", time = "06:00:00" }

[resources.evaluate]
default = { cpus = 16, mem = "100G", time = "12:00:00" }

[resources.truth-original]
default = { cpus = 8, mem = "100G", time = "3-00:00:00" }
"TX-123BT" = { mem = "120G" }   # MUSICA: 240G - capped below the RAM

[resources.rp]
default = { cpus = 8, mem = "16G", time = "3-00:00:00" }
"TX-123BT" = { mem = "32G" }

[resources.full]
default = { cpus = 8, mem = "48G", time = "3-00:00:00" }
"NREL-118" = { mem = "64G" }
"TX-123BT" = { mem = "120G" }   # MUSICA: 128G - capped below the RAM

# Task pool. cores / mem are not needed (only for submit-workers on Slurm): each worker takes its machine's physical cores
# and RAM (--cores / --mem to override).
[pool]
seed_runs = ["pilot", "experiment-win"]  # memory estimates: MUSICA's pilot (if runs/pilot/measurements.json is copied to the
                                         # share) and the 0.3 % run on these servers (its failed attempts are not used)
mem_fraction = 0.9     # share of the RAM that tasks are packed into
idle_hours = 3         # a worker without anything to run waits this long before it exits
# Dataset order: priority = remaining chain of dependent tasks (critical path) x weight, so a TX-123BT task goes before
# an RTS-GMLC task only if its chain is more than 10x longer (NREL-118 vs TX-123BT likewise; random TM stays last)
dataset_weights = { "RTS-GMLC" = 100, "TX-123BT" = 10, "NREL-118" = 1 }

[evaluate]
args = ["all", "--no-show", "--separateClusters"]
output_dir = "results/experiment-win-gap0.5"
