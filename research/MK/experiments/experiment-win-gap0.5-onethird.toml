# One-third-year variant of experiment with MIP gap of 0.5 %
# Limited to the first 122 days: --limitK k0001-k2928
# One worker per server, started by hand (see README, "Windows servers"):
#   python research/MK/cluster.py worker experiment-win-gap0.5-onethird --detach
#   python research/MK/cluster.py status experiment-win-gap0.5-onethird          # / stop / restart, from any server
# Running workers reload this file within a minute of a change (added / removed runs, resources) - no restart needed.

name = "experiment-win-gap0.5-onethird"   # pool and logs go to research/MK/runs/<name>/ in the repo clone on the network drive

[markov]
args = ["--network", "TP", "--mip-gap", "0.005", "--limitK", "k0001-k2928"]   # model options
# NodefileStart (GB): the B&B tree goes to node files early (--node-dir on a fast local SSD); the same for all solves of a
# dataset (it affects the runtime).
node_file_start = { default = 8 }

[grid]
datasets = ["data/RTS-GMLC", "data/TX-123BT", "data/NREL-118"]   # = scheduling preference (as in experiment.toml)
stretch_demand = [1.0, 0.5, 0.7, 0.9]
clusters = [3, 5, 7, 14, 21, 28]
# 'perturb:1.0' = random transition matrix (optional runs): only without demand stretching, queued after all other runs.
# Shifted and random TMs only for RTS-GMLC (datasets = only these datasets).
tm = ["base",
      { spec = "shift:1", datasets = ["data/RTS-GMLC"] },
      { spec = "shift:2", datasets = ["data/RTS-GMLC"] },
      { spec = "perturb:1.0", stretch_demand = [1.0], low_priority = true, datasets = ["data/RTS-GMLC"] }]
edges = ["NoEnf", "Cyclic", "Markov"]                # Truth is added automatically where it applies
tasks = ["main", "operational", "regret", "invest-regret", "operational-regret",
         "original-invest-regret", "original-regret"]   # original-* only for tm = base
truth_original = true                                   # one Original Truth per dataset and demand variability

[resources.prepare]
default = { cpus = 8, mem = "8G", time = "02:00:00" }

[resources.evaluate]
default = { cpus = 16, mem = "100G", time = "12:00:00" }

[resources.truth-original]
default = { cpus = 8, mem = "20G", time = "01:30:00" }
"TX-123BT" = { mem = "30G", time = "02:00:00" }
"NREL-118" = { mem = "28G", time = "02:00:00" }

[resources.rp]
default = { cpus = 8, mem = "8G", time = "00:10:00" }
"NREL-118" = { mem = "18G", time = "00:50:00" }
"TX-123BT" = { mem = "11G", time = "00:20:00" }

[resources.full]
default = { cpus = 8, mem = "20G", time = "01:00:00" }
"NREL-118" = { mem = "28G", time = "01:00:00" }
"TX-123BT" = { mem = "30G", time = "01:00:00" }

[pool]
seed_runs = []  # estimates only from this pool's own measurements (and the priors above)
mem_fraction = 0.9     # share of the RAM that tasks are packed into
idle_hours = 96        # a worker without anything to run waits this long before it exits
# Work units are only comparable within a CPU class (check_workunits.py groups): the main / operational solves of a grid
# point wait for its main Truth and run on the CPU class it finished on ("dataset": one class per dataset, "none": off)
cpu_pin = "grid-point"
# Dataset order: priority = remaining chain of dependent tasks (critical path) x weight, so a TX-123BT task goes before
# an RTS-GMLC task only if its chain is more than 10x longer (NREL-118 vs TX-123BT likewise; random TM stays last)
dataset_weights = { "RTS-GMLC" = 100, "TX-123BT" = 10, "NREL-118" = 1 }
# Local folders on each server (read at worker start; --node-dir / --spool-dir override them)
node_dir = "C:/gurobi-nodes"   # Gurobi node files - a large, fast local disk
spool_dir = "C:/mk-spool"      # local-first writes: logs, outputs and results survive a dropped share connection

[evaluate]
args = ["all", "--no-show", "--separateClusters"]
output_dir = "results/experiment-win-gap0.5-onethird"
